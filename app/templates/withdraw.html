{% extends "base.html" %}
{% block title %}Withdraw{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Withdraw Money</h3>
        <p>Current balance: <strong>${{ "%.2f"|format(account.balance) }}</strong></p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Amount ($)</label>
            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required autofocus>
          </div>
          <button type="submit" class="btn btn-warning w-100">Withdraw</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
